# H&M Personalized Fashion Recommendations — Competition Config
#
# NOTE: Data files live in data_raw/ (not data/raw/).
# Framework's get_data_path() resolves to data/raw/, so scripts
# should use `cfg.project_root / "data_raw"` for actual file paths.

competition:
  name: "H&M Personalized Fashion Recommendations"
  slug: "h-and-m-personalized-fashion-recommendations"
  url: "https://www.kaggle.com/competitions/h-and-m-personalized-fashion-recommendations"
  metric: "MAP@12"
  metric_direction: "maximize"
  task_type: "recommendation"

data:
  train_file: "transactions_train.csv"
  test_file: "sample_submission.csv"
  target_col: null
  id_col: "customer_id"
  submission_format: "space_separated_ids"

training:
  n_folds: 5
  random_state: 42
  cv_strategy: "time_based"

models:
  default: "lightgbm"
  lightgbm:
    objective: "binary"
    metric: "average_precision"
    boosting_type: "gbdt"
    num_leaves: 63
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    min_child_samples: 50
    verbose: -1

mlflow:
  experiment_name: "hm_recommendations"
  tracking_uri: "sqlite:///mlflow.db"

submission:
  max_per_day: 5
  validate_before_submit: true
